<!DOCTYPE html>
<html>
<body>
    <h2>Distribution History</h2>

    <a href="/distribute">+ Distribute Ration</a>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Beneficiary</th>
            <th>Item</th>
            <th>Quantity</th>
            <th>Date</th>
        </tr>

        {% for r in records %}
        <tr>
            <td>{{ r.id }}</td>
            <td>{{ r.beneficiary.name }}</td>
            <td>{{ r.item.name }}</td>
            <td>{{ r.quantity }}</td>
            <td>{{ r.date.strftime('%d-%m-%Y') }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
