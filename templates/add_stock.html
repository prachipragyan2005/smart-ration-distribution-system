<!DOCTYPE html>
<html>
<body>
    <h2>Allocate Stock</h2>

    <form method="POST">
        Item:
        <select name="item_id">
            {% for item in items %}
            <option value="{{ item.id }}">{{ item.name }} ({{ item.unit }})</option>
            {% endfor %}
        </select><br><br>

        Shop Name: <input type="text" name="shop_name"><br><br>
        Quantity: <input type="number" step="0.01" name="quantity"><br><br>

        <button type="submit">Add Stock</button>
    </form>
</body>
</html>
